<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской бой</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        .container {
            background: #1a1a4a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,100,255,0.3);
            max-width: 95vw;
        }
        h1 {
            color: #4af;
            text-align: center;
            margin: 0 0 10px 0;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(68,170,255,0.5);
        }
        .boards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .board-container {
            background: #0a0a3a;
            padding: 10px;
            border-radius: 12px;
        }
        .board-title {
            color: #88ccff;
            text-align: center;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .board {
            display: grid;
            gap: 2px;
        }
        .cell {
            width: 28px;
            height: 28px;
            background: #1a2a5a;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }
        .cell:active { transform: scale(0.92); }
        .cell.ship { background: #2a6aaa; }
        .cell.hit { background: #ff3333; animation: hitAnim 0.3s; }
        .cell.miss { background: #334466; }
        .cell.miss::after { content: "·"; color: #6688aa; }
        @keyframes hitAnim {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .status {
            color: #aaddff;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            background: #0a0a3a;
            border-radius: 12px;
            margin-top: 12px;
            min-height: 50px;
        }
        .btn {
            background: #2a6aaa;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 4px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); background: #1a4a8a; }
        .btn-group { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .scores {
            color: #88ddff;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            padding: 6px;
        }
        .scores span { color: #ffcc44; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚓ МОРСКОЙ БОЙ</h1>
    <div class="scores">
        <div>Ваши корабли: <span id="p1Ships">10</span></div>
        <div>Корабли врага: <span id="p2Ships">10</span></div>
    </div>
    <div class="boards">
        <div class="board-container">
            <div class="board-title">Ваше поле</div>
            <div class="board" id="playerBoard"></div>
        </div>
        <div class="board-container">
            <div class="board-title">Поле противника</div>
            <div class="board" id="enemyBoard"></div>
        </div>
    </div>
    <div class="status" id="status">Нажми на клетку врага чтобы выстрелить</div>
    <div class="btn-group">
        <button class="btn" onclick="resetGame()">🔄 Новая игра</button>
        <button class="btn" onclick="toggleColors()">🎨 Цвета</button>
    </div>
</div>
<script>
const SIZE = 8;
let playerBoard = [];
let enemyBoard = [];
let enemyVisible = [];
let playerShips = 10;
let enemyShips = 10;
let gameOver = false;
let colorsOn = true;
const shipSizes = [3, 2, 2, 1, 1, 1];

function createEmptyBoard() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
}

function canPlace(board, row, col, size, horizontal) {
    for (let i = -1; i < size + 1; i++) {
        for (let j = -1; j < 2; j++) {
            let r = row + (horizontal ? i : j);
            let c = col + (horizontal ? j : i);
            if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
                if (board[r][c] !== 0) return false;
            }
        }
    }
    for (let i = 0; i < size; i++) {
        let r = row + (horizontal ? 0 : i);
        let c = col + (horizontal ? i : 0);
        if (r >= SIZE || c >= SIZE) return false;
        if (board[r][c] !== 0) return false;
    }
    return true;
}

function placeShips(board) {
    let ships = [...shipSizes];
    for (let size of ships) {
        let placed = false;
        let attempts = 0;
        while (!placed && attempts < 500) {
            attempts++;
            let row = Math.floor(Math.random() * SIZE);
            let col = Math.floor(Math.random() * SIZE);
            let horizontal = Math.random() > 0.5;
            if (canPlace(board, row, col, size, horizontal)) {
                for (let i = 0; i < size; i++) {
                    board[row + (horizontal ? 0 : i)][col + (horizontal ? i : 0)] = 1;
                }
                placed = true;
            }
        }
        if (!placed) {
            board = createEmptyBoard();
            return placeShips(board);
        }
    }
    return board;
}

function initGame() {
    playerBoard = createEmptyBoard();
    enemyBoard = createEmptyBoard();
    enemyVisible = createEmptyBoard();
    placeShips(playerBoard);
    placeShips(enemyBoard);
    playerShips = shipSizes.reduce((a,b) => a + b, 0);
    enemyShips = playerShips;
    gameOver = false;
    document.getElementById('status').textContent = 'Нажми на клетку врага чтобы выстрелить';
    render();
}

function render() {
    const p1Board = document.getElementById('playerBoard');
    const p2Board = document.getElementById('enemyBoard');
    p1Board.style.gridTemplateColumns = `repeat(${SIZE}, 28px)`;
    p2Board.style.gridTemplateColumns = `repeat(${SIZE}, 28px)`;
    
    p1Board.innerHTML = '';
    p2Board.innerHTML = '';
    
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            // Игрок
            let cell1 = document.createElement('div');
            cell1.className = 'cell';
            let val = playerBoard[r][c];
            if (val === 1) cell1.classList.add('ship');
            else if (val === 2) cell1.classList.add('hit');
            else if (val === 3) cell1.classList.add('miss');
            if (val === 2) cell1.textContent = '✕';
            p1Board.appendChild(cell1);
            
            // Враг
            let cell2 = document.createElement('div');
            cell2.className = 'cell';
            let v = enemyVisible[r][c];
            if (v === 2) { cell2.classList.add('hit'); cell2.textContent = '✕'; }
            else if (v === 3) cell2.classList.add('miss');
            else if (!gameOver && colorsOn && enemyBoard[r][c] === 1) {
                // В режиме цветов показываем корабли
                cell2.classList.add('ship');
            }
            cell2.dataset.row = r;
            cell2.dataset.col = c;
            cell2.onclick = () => makeShot(r, c);
            p2Board.appendChild(cell2);
        }
    }
    document.getElementById('p1Ships').textContent = playerShips;
    document.getElementById('p2Ships').textContent = enemyShips;
}

function makeShot(row, col) {
    if (gameOver) return;
    if (enemyVisible[row][col] !== 0) {
        document.getElementById('status').textContent = 'Сюда уже стреляли!';
        return;
    }
    
    if (enemyBoard[row][col] === 1) {
        enemyBoard[row][col] = 2;
        enemyVisible[row][col] = 2;
        enemyShips--;
        document.getElementById('status').textContent = '🔥 ПОПАДАНИЕ!';
        if (enemyShips === 0) {
            gameOver = true;
            document.getElementById('status').textContent = '🏆 ВЫ ПОБЕДИЛИ!';
        }
    } else {
        enemyVisible[row][col] = 3;
        document.getElementById('status').textContent = '❌ Промах! Ход врага...';
        render();
        setTimeout(() => computerTurn(), 500);
        return;
    }
    render();
    if (!gameOver) {
        setTimeout(() => computerTurn(), 400);
    }
}

function computerTurn() {
    if (gameOver) return;
    let attempts = 0;
    while (attempts < 100) {
        let r = Math.floor(Math.random() * SIZE);
        let c = Math.floor(Math.random() * SIZE);
        if (playerBoard[r][c] === 1) {
            playerBoard[r][c] = 2;
            playerShips--;
            document.getElementById('status').textContent = `💥 Враг попал в ${String.fromCharCode(65+c)}${r+1}!`;
            if (playerShips === 0) {
                gameOver = true;
                document.getElementById('status').textContent = '💀 ВЫ ПРОИГРАЛИ...';
                render();
                return;
            }
            render();
            setTimeout(() => computerTurn(), 400);
            return;
        } else if (playerBoard[r][c] === 0) {
            playerBoard[r][c] = 3;
            document.getElementById('status').textContent = `Враг промахнулся по ${String.fromCharCode(65+c)}${r+1}`;
            render();
            return;
        }
        attempts++;
    }
    render();
}

function resetGame() {
    initGame();
}

function toggleColors() {
    colorsOn = !colorsOn;
    render();
}

initGame();
</script>
</body>
</html>
